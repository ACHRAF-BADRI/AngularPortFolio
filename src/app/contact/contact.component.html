<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<div class="contact">
  <h1>{{ translation.t('contact.title') }}</h1>
  <mat-card>
    <div class="contact-details">
      <div class="detail">
        <mat-icon>person</mat-icon>
        <span>Achraf El Badri</span>
      </div>
      <div class="detail">
        <mat-icon>email</mat-icon>
        <a class="email-link" href="mailto:achrafelbadri1&#64;gmail.com">achrafelbadri1&#64;gmail.com</a>
      </div>
      <div class="detail">
        <mat-icon>location_on</mat-icon>
        <span>Paris, France</span>
      </div>
    </div>
    <div class="social-media">
      <a href="https://www.linkedin.com/in/achraf-el-badri-769645245" target="_blank" rel="noopener noreferrer"><i class="fa fa-linkedin" style="margin-right: 40px;"></i></a>
      <a href="https://github.com/ACHRAF-BADRI" target="_blank" rel="noopener noreferrer"><i class="fa fa-github" style="margin-right: 40px;"></i></a>
      <a href="https://www.instagram.com/achraf_badri/" target="_blank" rel="noopener noreferrer"><i class="fa fa-instagram"></i></a>
    </div>
  </mat-card>

  <mat-card class="form-card">
    <h2>{{ translation.t('contact.formTitle') }}</h2>
    <form #contactForm="ngForm" (ngSubmit)="onSubmit(contactForm)" novalidate>
      <!-- Honeypot: invisible to people, bots fill it in and get silently ignored -->
      <label class="honeypot" aria-hidden="true">
        Website <input name="website" [(ngModel)]="contact.website" tabindex="-1" autocomplete="off">
      </label>

      <label class="field">
        <span>{{ translation.t('contact.name') }}</span>
        <input name="name" [(ngModel)]="contact.name" required maxlength="100" autocomplete="name">
      </label>
      <label class="field">
        <span>{{ translation.t('contact.email') }}</span>
        <input name="email" type="email" [(ngModel)]="contact.email" required email maxlength="254" autocomplete="email">
      </label>
      <label class="field">
        <span>{{ translation.t('contact.message') }}</span>
        <textarea name="message" [(ngModel)]="contact.message" required maxlength="5000" rows="6"></textarea>
      </label>

      <button type="submit" [disabled]="sending()">
        {{ translation.t(sending() ? 'contact.sending' : 'contact.send') }}
      </button>

      @if (slow()) {
        <p class="form-note">{{ translation.t('contact.slow') }}</p>
      }
    </form>
  </mat-card>
</div>
