<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <header class="header">
    <a routerLink="/" class="logo">ACHRAF EL BADRI</a>
    <input class="menu-btn" type="checkbox" id="menu-btn" />
    <label class="menu-icon" for="menu-btn"><span class="navicon"></span></label>

    <ul class="menu">
      <li><a class="navbtn" routerLink="/">Home</a></li>
      <li><a class="navbtn" routerLink="/about">About</a></li>
      <li><a class="navbtn" routerLink="/projects">Projects</a></li>
      <li><a class="navbtn" routerLink="/experience">Experience</a></li>
      <li><a class="navbtn" routerLink="/contact">Contact</a></li>
      <li class="theme-toggle-item">
        <button
          class="theme-toggle-btn"
          type="button"
          (click)="toggleTheme()"
          [attr.aria-label]="isDark() ? 'Activer le mode clair' : 'Activer le mode sombre'"
          [attr.aria-pressed]="isDark()">
          <svg *ngIf="!isDark()" class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <line x1="12" y1="2" x2="12" y2="4.5"></line>
            <line x1="12" y1="19.5" x2="12" y2="22"></line>
            <line x1="4.93" y1="4.93" x2="6.64" y2="6.64"></line>
            <line x1="17.36" y1="17.36" x2="19.07" y2="19.07"></line>
            <line x1="2" y1="12" x2="4.5" y2="12"></line>
            <line x1="19.5" y1="12" x2="22" y2="12"></line>
            <line x1="4.93" y1="19.07" x2="6.64" y2="17.36"></line>
            <line x1="17.36" y1="6.64" x2="19.07" y2="4.93"></line>
          </svg>
          <svg *ngIf="isDark()" class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </li>
    </ul>
  </header>

</body>
</html>
