<div class="modal-backdrop" *ngIf="isOpen" (click)="onBackdropClick($event)">
  <div class="modal-box" role="dialog" aria-modal="true" [attr.aria-label]="title">
    <div class="modal-header">
      <h2>{{ title }}</h2>
      <button class="modal-close" type="button" (click)="onClose()" [attr.aria-label]="translation.t('common.close')">&times;</button>
    </div>
    <div class="modal-subtitle" *ngIf="subtitle">{{ subtitle }}</div>
    <div class="modal-body">
      <img *ngIf="image" [src]="image" alt="" class="modal-image">
      <p *ngIf="description" class="modal-description">{{ description }}</p>
      <ul class="modal-details" *ngIf="details && details.length">
        <li *ngFor="let detail of details">{{ detail }}</li>
      </ul>
      <div class="modal-links" *ngIf="link || githubLink">
        <a class="modal-link" *ngIf="link" [href]="link" target="_blank" rel="noopener noreferrer">{{ translation.t('common.liveDemo') }} ↗</a>
        <a class="modal-link" *ngIf="githubLink" [href]="githubLink" target="_blank" rel="noopener noreferrer">{{ translation.t('common.sourceCode') }} ↗</a>
      </div>
      <div class="modal-tech" *ngIf="tech && tech.length">
        <span class="badge" *ngFor="let t of tech">{{ t }}</span>
      </div>
    </div>
  </div>
</div>
