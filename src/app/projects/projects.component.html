<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<div class="projects" [ngClass]="{'visible': isVisible}">
  <h1>{{ translation.t('projects.title') }}</h1>
  <div class="projects-container">
    <div class="project-card" *ngFor="let project of projects">
      <div class="card">
        <div class="card-content">
          <div class="project-image" [class.contain]="project.imageFit === 'contain'">
            <img [src]="project.image" alt="Project Image">
          </div>
          <div class="project-details">
            <h2>{{ translation.pick(project.title, project.titleEn) }}</h2>
            <div class="project-period" *ngIf="project.period">{{ translation.pick(project.period, project.periodEn) }}</div>
            <button class="details-btn" type="button" (click)="openDetails(project)">{{ translation.t('common.viewDetails') }}</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<app-detail-modal
  [isOpen]="isModalOpen"
  [title]="translation.pick(selectedProject?.title || '', selectedProject?.titleEn)"
  [subtitle]="translation.pick(selectedProject?.period || '', selectedProject?.periodEn)"
  [description]="translation.pick(selectedProject?.description || '', selectedProject?.descriptionEn)"
  [tech]="translation.pickList(selectedProject?.tech, selectedProject?.techEn)"
  (closeModal)="closeDetails()">
</app-detail-modal>

<div class="social-media">
  <a href="https://github.com/ACHRAF-BADRI" target="_blank" rel="noopener noreferrer"><i class="fa fa-github" style="margin-right: 40px;"></i></a>
</div>

<button class="scroll-to-top-btn" (click)="scrollToTop()" [class.visible]="isScrollButtonVisible">{{ translation.t('common.top') }}</button>
